<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Briçhane</title>
    <meta
      name="description"
      content="Briç dersleri için konuya göre el üretir, analiz eder, yazdırır."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fffdf8" />
    <script>
      // Kayıtlı tema ilk boyamadan önce uygulanır (varsayılan açık); bkz. src/hooks/useTheme.ts.
      try {
        if (localStorage.getItem('brichane.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c201c')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
